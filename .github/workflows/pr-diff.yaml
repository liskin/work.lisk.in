name: PR site diff

on:
  pull_request:

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
          path: pr

      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
          path: base

      - name: Setup Ruby (PR)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0
          working-directory: pr

      - name: Setup Ruby (base)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0
          working-directory: base

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Build PR branch
        run: just build
        working-directory: pr

      - name: Build base branch
        run: just build
        working-directory: base

      - name: Diff _site directories
        id: site-diff
        run: |
          set +e
          diff_output=$(diff -rq --exclude='*.map' base/_site pr/_site 2>&1)
          diff_exit=$?
          set -e
          if [ $diff_exit -eq 0 ]; then
            echo "diff_body=No changes in rendered site." >> "$GITHUB_OUTPUT"
          else
            full_diff=$(diff -ru --exclude='*.map' base/_site pr/_site 2>&1 || true)
            {
              echo 'diff_body<<EOF'
              echo '<details><summary>Site diff</summary>'
              echo ''
              echo '```diff'
              echo "$full_diff"
              echo '```'
              echo '</details>'
              echo EOF
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Post diff as PR comment
        uses: actions/github-script@v7
        env:
          DIFF_BODY: ${{ steps.site-diff.outputs.diff_body }}
        with:
          script: |
            const body = process.env.DIFF_BODY;
            const marker = '<!-- pr-site-diff -->';
            const fullBody = marker + '\n' + body;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
