name: PR site diff

on:
  pull_request:

jobs:
  build-pr:
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      artifact-name: site-pr

  build-base:
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    with:
      ref: ${{ github.base_ref }}
      artifact-name: site-base

  diff:
    runs-on: ubuntu-latest
    needs: [build-pr, build-base]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download PR site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-pr
          path: site-pr

      - name: Download base site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-base
          path: site-base

      - name: Diff _site directories
        id: site-diff
        run: |
          set +e
          diff_output=$(diff -rq --exclude='*.map' site-base site-pr 2>&1)
          diff_exit=$?
          set -e
          if [ $diff_exit -eq 0 ]; then
            echo "diff_body=No changes in rendered site." >> "$GITHUB_OUTPUT"
          else
            full_diff=$(diff -ru --exclude='*.map' site-base site-pr 2>&1 || true)
            {
              echo 'diff_body<<EOF'
              echo '<details><summary>Site diff</summary>'
              echo ''
              echo '```diff'
              echo "$full_diff"
              echo '```'
              echo '</details>'
              echo EOF
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Post diff as PR comment
        uses: actions/github-script@v7
        env:
          DIFF_BODY: ${{ steps.site-diff.outputs.diff_body }}
        with:
          script: |
            const body = process.env.DIFF_BODY;
            const marker = '<!-- pr-site-diff -->';
            const fullBody = marker + '\n' + body;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
